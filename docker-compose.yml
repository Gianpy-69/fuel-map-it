services:
  db:
    image: postgis/postgis:15-3.4
    container_name: fuelmap-db
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: fuelmap
      POSTGRES_USER: fuelmap_user
      POSTGRES_PASSWORD: fuelmap_secret
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
